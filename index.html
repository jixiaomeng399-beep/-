<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>디지털 문물 블라인드 박스</title>

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <!-- ml5.js 手势识别 -->
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

  <!-- 3D模型显示 -->
  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      position: relative;
      margin: 0;
      overflow: hidden;

      background-color: #e8d6b5;

      background-image:
        linear-gradient(
          rgba(255, 246, 222, 0.06),
          rgba(77, 51, 30, 0.08)
        ),
        url("assets/background.png");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family:
        "Noto Serif KR",
        "Songti SC",
        "STSong",
        "Apple SD Gothic Neo",
        serif;
    }

    .traditional-frame {
      position: fixed;
      top: 13px;
      right: 13px;
      bottom: 13px;
      left: 13px;

      z-index: 30;
      pointer-events: none;

      border: 1px solid rgba(151, 107, 45, 0.72);
      border-radius: 12px;

      box-shadow:
        inset 0 0 0 4px rgba(255, 244, 211, 0.10),
        inset 0 0 34px rgba(57, 39, 23, 0.12);
    }

    .corner-left {
      position: fixed;
      left: 26px;
      top: 26px;

      width: 58px;
      height: 58px;

      z-index: 31;
      pointer-events: none;

      border-left: 3px solid rgba(131, 77, 42, 0.68);
      border-top: 3px solid rgba(131, 77, 42, 0.68);
    }

    .corner-right {
      position: fixed;
      right: 26px;
      bottom: 26px;

      width: 58px;
      height: 58px;

      z-index: 31;
      pointer-events: none;

      border-right: 3px solid rgba(131, 77, 42, 0.68);
      border-bottom: 3px solid rgba(131, 77, 42, 0.68);
    }

    .top-decoration {
      position: fixed;
      left: 50%;
      top: 137px;

      width: min(72vw, 900px);
      height: 1px;

      transform: translateX(-50%);

      z-index: 2;
      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(156, 110, 50, 0.16) 15%,
          rgba(156, 110, 50, 0.76) 50%,
          rgba(156, 110, 50, 0.16) 85%,
          transparent 100%
        );
    }

    model-viewer {
      position: absolute;
      left: 0;
      top: 0;

      width: 100vw;
      height: 100vh;

      display: none;
      z-index: 1;

      background: transparent;

      transform-origin: center center;
      will-change: transform, opacity;

      pointer-events: none;
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;

      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="traditional-frame"></div>
  <div class="corner-left"></div>
  <div class="corner-right"></div>
  <div class="top-decoration"></div>

  <model-viewer
    id="artifact"
    src="assets/houmuwuding.glb"
    camera-controls
    camera-orbit="0deg 75deg 3m"
    field-of-view="27deg"
    exposure="1"
    shadow-intensity="0.85"
    interaction-prompt="none">
  </model-viewer>

  <script src="sketch.js"></script>

</body>
</html>
